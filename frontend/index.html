<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste</title>
    <link rel="icon" type="image/x-icon" href="./assets/icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="glass-panel form-section">
        <h2>Adicionar Nova Mídia</h2>
        
        <div class="form-group">
            <label for="titulo">Título da Obra</label>
            <input type="text" id="titulo" placeholder="Ex: Interstellar" oninput="validarTitulo()">
            <span id="erroTitulo" class="mensagem"></span>
        </div>
        
        <div class="form-group">
            <label for="tipo">Categoria</label>
            <select id="tipo" onchange="validarTipo()">
                <option value="" selected disabled>Selecione...</option>
            </select>
            <span id="erroTipo" class="mensagem"></span>
        </div>
        
        <div class="form-group">
            <label for="nota">Nota (1 a 10)</label>
            <input type="number" id="nota" min="1" max="10" placeholder="Ex: 10" oninput="validarNota()">
            <span id="erroNota" class="mensagem"></span>
        </div>
        
        <div class="form-group">
            <label for="foto">URL do Pôster/Capa (Opcional)</label>
            <input type="text" id="foto" placeholder="https://link-da-imagem.com/foto.jpg">
        </div>
        
        <div class="form-group">
            <label for="comentario">Sua Crítica (Opcional)</label>
            <textarea id="comentario" rows="3" placeholder="O que achou da experiência?"></textarea>
        </div>
        
        <button type="button" onclick="cadastrarMidia()">Salvar no Acervo</button>
        <p id="erroBotao" class="mensagem mensagemButton"></p>
    </div>

    <div class="glass-panel list-section">
        <h2>Meu Acervo</h2>
        <div id="mediaList">
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
